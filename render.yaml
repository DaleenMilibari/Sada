# Render Blueprint - deploys the FastAPI backend.
# The React frontend is deployed separately on Vercel (set VITE_API_BASE there).
services:
  - type: web
    name: sada-api
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SADA_ENV
        value: production
      - key: SADA_TRUSTED_PROXY_HOPS
        value: "1"
      - key: SADA_SECRET_KEY
        generateValue: true
      - key: SADA_ACCESS_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        sync: false
