# Render Blueprint - deploys the FastAPI backend + its Postgres database.
# The React frontend is deployed separately on Vercel (set VITE_API_BASE there).
databases:
  - name: sada-db
    plan: free            # free Postgres expires after 30 days - upgrade or export before then
    region: frankfurt
    databaseName: sada
    user: sada

services:
  - type: web
    name: sada-api
    runtime: python
    plan: starter         # must not sleep: the Data Collector schedule runs in-process
    region: frankfurt
    numInstances: 1       # in-process scheduler + in-memory rate limits assume a single instance
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SADA_ENV
        value: production
      - key: SADA_TRUSTED_PROXY_HOPS
        value: "1"
      - key: SADA_SECRET_KEY
        generateValue: true
      - key: SADA_ACCESS_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sada-db
          property: connectionString
      - key: YOUTUBE_API_KEY
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_BUSINESS_ACCOUNT_ID
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v23.0
      - key: COLLECTOR_SCHEDULE_ENABLED
        value: "true"
      - key: COLLECTOR_INTERVAL_MINUTES
        value: "30"
      - key: COLLECTOR_QUOTA_PER_RUN
        value: "300"
      - key: COLLECTOR_LOOKBACK_DAYS
        value: "60"
